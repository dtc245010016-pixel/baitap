<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <title>Thẻ hình ảnh trong HTML</title>
    </head>
    <body>
        <h1>Hình ảnh yêu thích của tôi</h1>

        <!-- 
            Thẻ <img> dùng để chèn hình ảnh:
            - src: Đường dẫn tới hình ảnh (có thể là link online hoặc file trong cùng thư mục)
            - alt: Văn bản mô tả hình ảnh (xuất hiện khi ảnh lỗi hoặc hỗ trợ trình đọc màn hình)
            - width/height: Khai báo kích thước hiển thị của ảnh (tùy chọn)
        -->
        <img src="https://picsum.photos/600/400" alt="Hình ảnh phong cảnh thiên nhiên đẹp mắt" width="600" height="400">

        <p>Đoạn văn mô tả thêm cho hình ảnh trên trang web.</p>
    </body>
</html>
